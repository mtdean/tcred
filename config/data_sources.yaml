# ── SEC EDGAR ────────────────────────────────────────────────
# Free API — https://data.sec.gov
# No key required; must set User-Agent header (see backend config)
edgar:
  # Form types to monitor for ABS issuance activity
  form_types:
    - "ABS-15G"      # Asset-backed securitizer rep/warranty report
    - "ABS-EE"       # ABS asset data file (Reg AB II)
    - "8-K"          # Current reports (often announce new deals)
    - "S-3"          # Shelf registration (precursor to ABS issuance)
    - "424B5"        # Prospectus supplement (actual deal pricing)

  # Asset classes to filter on by keyword in filing text
  asset_class_keywords:
    - "equipment finance"
    - "equipment lease"
    - "esoteric"
    - "consumer loan"
    - "auto loan"
    - "marketplace lending"
    - "personal loan"
    - "solar"
    - "royalty"
    - "data center"
    - "whole business"
    - "aircraft"
    - "container"
    # Phase 7 — CLO surveillance
    - "collateralized loan obligation"
    - "CLO"
    - "broadly syndicated"
    - "middle market CLO"

  # Known ABS issuers CIKs to monitor directly (add more as discovered)
  # Find at: https://efts.sec.gov/LATEST/search-index?q=%22asset-backed%22&dateRange=custom
  monitored_ciks: []  # populate over time

# ── ABS NEW-ISSUE SPREAD MOMENTUM ────────────────────────────
# Discovers ABS pricing term sheets (FWP) on EDGAR and parses per-tranche
# new-issue spreads. Keywords match deal/trust names; the pricing sheet itself
# is then reached via the trust's filing history. Token-free (regex parse).
abs_pricing:
  discovery_keywords:
    - "auto receivables"
    - "auto owner trust"
    - "auto lease"
    - "equipment finance"
    - "dealer floorplan"
    - "floorplan"
    - "credit card"
    - "card funding"
    - "master trust"
    - "student loan"

# ── Phase 7 — BDC Portfolio Monitor ──────────────────────────
# SEC publishes a free monthly bulk dataset of BDC XBRL Schedule of Investments
# (SOI) at https://www.sec.gov/data-research/sec-markets-data/bdc-data-sets.
# We ingest the ZIP, parse SOI.tsv, and roll up per-BDC summary metrics. The
# watch list is informational — the parser stores all BDCs in the dataset and
# the watch list determines the default sort/highlight order in the UI.
bdc:
