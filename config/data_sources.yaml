# ============================================================
# SITUATION MONITOR — DATA SOURCE CONFIGURATION
# ============================================================

# ── FRED (Federal Reserve Economic Data) ────────────────────
# Free API — get key at https://fred.stlouisfed.org/docs/api/
# Set env var: FRED_API_KEY
fred_series:

  # Consumer Credit & Delinquencies
  - id: "DRCCLACBS"
    label: "Credit Card Delinquency Rate (90+ days)"
    category: consumer_credit
    frequency: quarterly

  - id: "DRSFRMACBS"
    label: "Single-Family Mortgage Delinquency Rate"
    category: consumer_credit
    frequency: quarterly

  # FRED has no auto-loan bank delinquency series; use all-consumer-loans instead.
  - id: "DRCLACBS"
    label: "Consumer Loan Delinquency Rate"
    category: consumer_credit
    frequency: quarterly

  - id: "DRCCLOBS"
    label: "Consumer Loan Delinquency Rate"
    category: consumer_credit
    frequency: quarterly

  # Charge-offs
  - id: "CORCCACBS"
    label: "Credit Card Net Charge-Off Rate"
    category: consumer_credit
    frequency: quarterly

  - id: "CORALACBS"
    label: "All Loans Net Charge-Off Rate"
    category: consumer_credit
    frequency: quarterly

  # Consumer Credit Outstanding
  - id: "TOTALSL"
    label: "Total Consumer Credit Outstanding"
    category: consumer_credit
    frequency: monthly

  - id: "REVOLSL"
    label: "Revolving Credit Outstanding"
    category: consumer_credit
    frequency: monthly

  - id: "NONREVSL"
    label: "Non-Revolving Credit Outstanding"
    category: consumer_credit
    frequency: monthly

  # Rates
  - id: "FEDFUNDS"
    label: "Federal Funds Rate"
    category: rates
    frequency: monthly

  - id: "DGS10"
    label: "10-Year Treasury Yield"
    category: rates
    frequency: daily

  - id: "DGS2"
    label: "2-Year Treasury Yield"
    category: rates
    frequency: daily

  - id: "T10Y2Y"
    label: "10Y-2Y Treasury Spread"
    category: rates
    frequency: daily

  # 10y-3m term spread — the NY Fed recession-probit input (more reliable than
  # 2s10s per Estrella-Mishkin). Drives the computed NYFED_RECESSION_PROB series.
  - id: "T10Y3M"
    label: "10Y-3M Treasury Spread"
    category: rates
    frequency: daily

  # Treasury yield curve tenors (forward-curve panel: today / 6mo / 1yr)
  - id: "DTB3"
    label: "3-Month Treasury Bill"
    category: rates
    frequency: daily

  - id: "DTB6"
    label: "6-Month Treasury Bill"
    category: rates
    frequency: daily

  - id: "DGS1"
    label: "1-Year Treasury Yield"
    category: rates
    frequency: daily

  - id: "DGS3"
    label: "3-Year Treasury Yield"
    category: rates
    frequency: daily

  - id: "DGS5"
    label: "5-Year Treasury Yield"
    category: rates
    frequency: daily

  - id: "DGS7"
    label: "7-Year Treasury Yield"
    category: rates
    frequency: daily

  - id: "DGS20"
    label: "20-Year Treasury Yield"
    category: rates
    frequency: daily

  - id: "DGS30"
    label: "30-Year Treasury Yield"
    category: rates
    frequency: daily

  # SOFR (term averages + index for computing a trailing 1yr rate)
  - id: "SOFR30DAYAVG"
    label: "30-Day Average SOFR (1M)"
    category: rates
    frequency: daily

  - id: "SOFR90DAYAVG"
    label: "90-Day Average SOFR (3M)"
    category: rates
    frequency: daily

  - id: "SOFRINDEX"
    label: "SOFR Index"
    category: rates
    frequency: daily

  - id: "BAMLH0A0HYM2"
    label: "HY OAS (ICE BofA)"
    category: spreads
    frequency: daily

  - id: "BAMLC0A0CM"
    label: "IG OAS (ICE BofA)"
    category: spreads
    frequency: daily

  - id: "BAMLH0A0HYM2EY"
    label: "HY Effective Yield"
    category: spreads
    frequency: daily

  # Macro
  - id: "UNRATE"
    label: "Unemployment Rate"
    category: macro
    frequency: monthly

  - id: "CPIAUCSL"
    label: "CPI (All Urban)"
    category: macro
    frequency: monthly

  - id: "CPILFESL"
    label: "Core CPI (ex Food & Energy)"
    category: macro
    frequency: monthly

  - id: "GDPC1"
    label: "Real GDP"
    category: macro
    frequency: quarterly

  - id: "UMCSENT"
    label: "University of Michigan Consumer Sentiment"
    category: macro
    frequency: monthly

  # ── FRED "Favorite Economic Dashboard" views (dashboard 9706) ──────
  # Activity / recession
  - id: "CFNAI"
    label: "Chicago Fed National Activity Index"
    category: activity
    frequency: monthly
  - id: "CFNAIMA3"
    label: "CFNAI (3-Month Moving Avg)"
    category: activity
    frequency: monthly
  - id: "RECPROUSM156N"
    label: "Smoothed Recession Probability"
    category: activity
    frequency: monthly

  # Financial stress / conditions
  - id: "STLFSI4"
    label: "St. Louis Fed Financial Stress Index"
    category: financial_conditions
    frequency: weekly
  - id: "NFCI"
    label: "Chicago Fed Financial Conditions Index"
    category: financial_conditions
    frequency: weekly

  # Inflation expectations
  - id: "T5YIE"
    label: "5Y Breakeven Inflation"
    category: inflation
    frequency: daily
  - id: "T5YIFR"
    label: "5Y5Y Forward Inflation Expectation"
    category: inflation
    frequency: daily
  - id: "MICH"
    label: "UMich Inflation Expectation"
    category: inflation
    frequency: monthly
  - id: "PCETRIM12M159SFRBDAL"
    label: "Trimmed Mean PCE Inflation"
    category: inflation
    frequency: monthly

  # Bank lending standards (SLOOS) + business credit.
  # Net % of banks tightening standards. Leads the delinquency curves by ~4
  # quarters (see the Fed's "Predicting Credit Card Delinquency Rates" model).
  # NOTE: credit-card tightening is DRTSCLCC (DRTSCLNC/STDSCREDIT do not exist).
  - id: "DRTSCILM"
    label: "Banks Tightening C&I Standards (Net %)"
    category: lending
    frequency: quarterly
  - id: "DRTSCLCC"
    label: "Banks Tightening Credit Card Standards (Net %)"
    category: lending
    frequency: quarterly
  - id: "STDSAUTO"
    label: "Banks Tightening Auto Loan Standards (Net %)"
    category: lending
    frequency: quarterly
  - id: "DRBLACBS"
    label: "Business Loan Delinquency Rate"
    category: consumer_credit
    frequency: quarterly

  # Household Debt Service Ratios (% of disposable income). Methodology break in
  # 2024-Q2: the Board switched to a credit-bureau-based measure — treat pre/post
  # vintages as not directly comparable. Watch CDSP (consumer ex-mortgage); the
  # mortgage DSR (MDSP) is distorted by the locked-in sub-3% mortgage stock.
  - id: "TDSP"
    label: "Household Debt Service Ratio (Total)"
    category: consumer_credit
    frequency: quarterly
  - id: "CDSP"
    label: "Consumer Debt Service Ratio (ex-Mortgage)"
    category: consumer_credit
    frequency: quarterly
  - id: "MDSP"
    label: "Mortgage Debt Service Ratio"
    category: consumer_credit
    frequency: quarterly

  # ── Recession / leading indicators ───────────────────────────────
  # Sahm Rule: triggers at +0.50pp. SAHMREALTIME uses real-time unemployment
  # vintages (honest for backtests); SAHMCURRENT uses latest-revised data.
  - id: "SAHMREALTIME"
    label: "Sahm Rule Recession Indicator (Real-Time)"
    category: recession_risk
    frequency: monthly
  - id: "SAHMCURRENT"
    label: "Sahm Rule Recession Indicator (Current)"
    category: recession_risk
    frequency: monthly

  # Adjusted NFCI — financial conditions relative to the economy (the more
  # genuinely *leading* variant of NFCI). Positive = tighter than the macro warrants.
  - id: "ANFCI"
    label: "Adjusted Chicago Fed Financial Conditions Index"
    category: financial_conditions
    frequency: weekly

  # Weekly Economic Index (Lewis-Mertens-Stock) — weekly GDP-equivalent nowcast.
  - id: "WEI"
    label: "Weekly Economic Index (GDP-equivalent %)"
    category: activity
    frequency: weekly

  # Early-cycle real-economy leads.
  - id: "TEMPHELPS"
    label: "Temporary Help Services Employment"
    category: labor
    frequency: monthly
  - id: "JTSQUR"
    label: "JOLTS Quits Rate"
    category: labor
    frequency: monthly
  - id: "PERMIT"
    label: "Building Permits (SAAR)"
    category: housing
    frequency: monthly

  # Credit Impulse inputs: total nonfinancial debt (Z.1) over nominal GDP.
  # TCMDO is the economy-wide credit stock (TOTALSL is consumer-only).
  - id: "TCMDO"
    label: "Total Nonfinancial Debt (Z.1)"
    category: credit
    frequency: quarterly
  - id: "GDP"
    label: "Nominal GDP (SAAR)"
    category: macro
    frequency: quarterly

  # Growth tracker (used as YoY)
  - id: "PCECC96"
    label: "Real Personal Consumption (Quarterly)"
    category: growth
    frequency: quarterly
  - id: "INDPRO"
    label: "Industrial Production Index"
    category: growth
    frequency: monthly
  - id: "PAYEMS"
    label: "Nonfarm Payrolls"
    category: growth
    frequency: monthly

  # Markets / FX
  - id: "SP500"
    label: "S&P 500"
    category: markets
    frequency: daily
  - id: "DTWEXBGS"
    label: "Nominal Broad U.S. Dollar Index"
    category: fx
    frequency: daily

  # ── Fed H.8 — Weekly Bank Credit (Phase 7) ───────────────────────
  # Published every Friday 4:15pm ET for the prior Wednesday. Drives the
  # H8CreditPanel on the Macro tab; raw series go through the existing FRED
  # fetcher, derived metrics (WoW, YoY, 4w MA, credit impulse) are computed
  # on-demand in data/h8.py.
  - id: "TOTLL"
    label: "Total Bank Loans & Leases"
    category: h8_bank_credit
    frequency: weekly
  - id: "CONSUMER"
    label: "Consumer Loans (All Banks)"
    category: h8_bank_credit
    frequency: weekly
  - id: "CCLACBW027SBOG"
    label: "Credit Card Loans (All Banks)"
    category: h8_bank_credit
    frequency: weekly
  - id: "CILACBW027SBOG"
    label: "C&I Loans (All Banks)"
    category: h8_bank_credit
    frequency: weekly
  - id: "REALLN"
    label: "Real Estate Loans (All Banks)"
    category: h8_bank_credit
    frequency: weekly
  - id: "DPSACBW027SBOG"
    label: "Total Deposits (All Banks)"
    category: h8_bank_credit
    frequency: weekly

