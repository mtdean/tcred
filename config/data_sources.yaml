# ── SEC EDGAR ────────────────────────────────────────────────
# Free API — https://data.sec.gov
# No key required; must set User-Agent header (see backend config)
edgar:
  # Form types to monitor for ABS issuance activity
  form_types:
    - "ABS-15G"      # Asset-backed securitizer rep/warranty report
    - "ABS-EE"       # ABS asset data file (Reg AB II)
    - "8-K"          # Current reports (often announce new deals)
    - "S-3"          # Shelf registration (precursor to ABS issuance)
    - "424B5"        # Prospectus supplement (actual deal pricing)

  # Asset classes to filter on by keyword in filing text
  asset_class_keywords:
    - "equipment finance"
    - "equipment lease"
    - "esoteric"
    - "consumer loan"
    - "auto loan"
    - "marketplace lending"
    - "personal loan"
    - "solar"
    - "royalty"
    - "data center"
    - "whole business"
    - "aircraft"
    - "container"

  # Known ABS issuers CIKs to monitor directly (add more as discovered)
  # Find at: https://efts.sec.gov/LATEST/search-index?q=%22asset-backed%22&dateRange=custom
  monitored_ciks: []  # populate over time

# ── SIFMA ────────────────────────────────────────────────────
# Manual download — no public API; scrape the stats pages
# or download Excel files. Data updated monthly/quarterly.
sifma:
  abs_stats_url: "https://www.sifma.org/research/statistics/us-asset-backed-securities-statistics"
  fixed_income_url: "https://www.sifma.org/research/statistics/us-fixed-income-securities-statistics"
  # Refresh: monthly (data lags ~3-4 weeks)
  refresh_frequency: monthly

# ── REFRESH SCHEDULE ─────────────────────────────────────────
refresh_intervals:
  market_data_minutes: 15       # yfinance tickers (token-free)
  fred_data_hours: 6            # FRED (token-free)
  news_feeds_minutes: 0         # 0 = OFF. News fetch+classify spends Claude tokens,
                                # so it runs only on demand via the REFRESH button.
                                # Set to e.g. 30 to re-enable automatic classification.
  edgar_filings_hours: 4        # EDGAR new filings (token-free)
