# ── Phase 7 — Regulatory Flow Monitor ────────────────────────
# Federal Register API: free, no key. Filterable by agency slug + type.
# Agency RSS feeds: free, no key. Press releases lead Federal Register publication
# by 1-2 days for major actions. Claude scoring is MANUAL (button), not scheduled.
regulatory:
  federal_register_api: "https://www.federalregister.gov/api/v1/documents.json"
  fr_agencies:
    - { slug: "consumer-financial-protection-bureau",  short: "CFPB" }
    - { slug: "comptroller-of-the-currency",           short: "OCC" }
    - { slug: "federal-deposit-insurance-corporation", short: "FDIC" }
    - { slug: "federal-reserve-system",                short: "Fed" }
    - { slug: "securities-and-exchange-commission",    short: "SEC" }
  agency_rss:
    CFPB: "https://www.consumerfinance.gov/about-us/newsroom/feed/"
    OCC:  "https://occ.gov/rss/occ-news-issuances.xml"
    FDIC: "https://www.fdic.gov/news/press-releases/rss.xml"
    Fed:  "https://www.federalreserve.gov/feeds/press_all.xml"
    SEC:  "https://www.sec.gov/news/pressreleases.rss"

# ── Phase 7 — KBRA Presale Parser ────────────────────────────
# Manual ingest workflow: user downloads presale PDFs to data/kbra/presales/,
# button on the KBRA sub-tab triggers PDF → text → Claude → structured row.
# (Auto-parsing would call Claude for every dropped PDF without consent.)
kbra:
  presale_dir: "data/kbra/presales"

# ── SIFMA ────────────────────────────────────────────────────
# Manual download — no public API; scrape the stats pages
# or download Excel files. Data updated monthly/quarterly.
sifma:
  abs_stats_url: "https://www.sifma.org/research/statistics/us-asset-backed-securities-statistics"
  fixed_income_url: "https://www.sifma.org/research/statistics/us-fixed-income-securities-statistics"
  # Refresh: monthly (data lags ~3-4 weeks)
  refresh_frequency: monthly

# ── REFRESH SCHEDULE ─────────────────────────────────────────
refresh_intervals:
  market_data_minutes: 15       # yfinance tickers (token-free)
  fred_data_hours: 6            # FRED (token-free)
  news_feeds_minutes: 0         # 0 = OFF. News fetch+classify spends Claude tokens,
                                # so it runs only on demand via the REFRESH button.
                                # Set to e.g. 30 to re-enable automatic classification.
  edgar_filings_hours: 4        # EDGAR new filings (token-free)
