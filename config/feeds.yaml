# ============================================================
# SITUATION MONITOR — RSS FEED CONFIGURATION
# ============================================================
# Add/remove feeds here without touching Python code.
# health_check: true means the app will ping on startup and
# flag broken feeds in the dashboard status bar.
#
# BEEHIIV FEEDS: These require manual URL lookup.
# Visit the publication site, view page source, search "rss".
# Mark needs_url: true to surface them in the health report.
# ============================================================

news_feeds:
  # WSJ direct RSS (feeds.a.dj.com) serves stale content here, so all WSJ feeds
  # use Google News site:wsj.com queries to get current headlines per beat.
  - name: "WSJ Markets"
    url: "https://news.google.com/rss/search?q=when:7d+site:wsj.com+(markets+OR+stocks+OR+bonds+OR+credit+OR+yields)&hl=en-US&gl=US&ceid=US:en"
    category: macro
    health_check: true

  - name: "WSJ World News"
    url: "https://news.google.com/rss/search?q=when:7d+site:wsj.com+world&hl=en-US&gl=US&ceid=US:en"
    category: macro
    health_check: true

  - name: "WSJ US Business"
    url: "https://news.google.com/rss/search?q=when:7d+site:wsj.com+(business+OR+earnings+OR+company+OR+CEO+OR+merger)&hl=en-US&gl=US&ceid=US:en"
    category: credit
    health_check: true

  - name: "WSJ Economy"
    url: "https://news.google.com/rss/search?q=when:7d+site:wsj.com+(economy+OR+inflation+OR+fed+OR+GDP)&hl=en-US&gl=US&ceid=US:en"
    category: macro
    health_check: true

  - name: "Bloomberg Markets"
    url: "https://feeds.bloomberg.com/markets/news.rss"
    category: macro
    health_check: true

  # FT home feed is front-page (politics/world) and scores low; use desk feeds instead.
  - name: "FT Markets"
    url: "https://www.ft.com/markets?format=rss"
    category: credit
    health_check: true

  - name: "FT Global Economy"
    url: "https://www.ft.com/global-economy?format=rss"
    category: macro
    health_check: true

  # Reuters killed its public RSS; MarketWatch Top Stories is a clean direct replacement.
  - name: "MarketWatch Top Stories"
    url: "https://feeds.marketwatch.com/marketwatch/topstories/"
    category: macro
    health_check: true

  - name: "NYT Economy"
    url: "https://rss.nytimes.com/services/xml/rss/nyt/Economy.xml"
    category: macro
    health_check: true

  - name: "FT Alphaville"
    url: "https://www.ft.com/rss/alphaville"
    category: credit
    health_check: true

  # SIFMA has no public RSS; CNBC Economy is a reliable direct macro feed.
  - name: "CNBC Economy"
    url: "https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01&id=20910258"
    category: macro
    health_check: true

  # Structured Credit Investor is paywalled (no public RSS); use a Google News
  # query as a securitization/ABS/CLO news aggregator instead.
  - name: "Securitization & ABS News"
    url: "https://news.google.com/rss/search?q=when:7d+(securitization+OR+%22asset-backed%22+OR+CLO)&hl=en-US&gl=US&ceid=US:en"
    category: structured_finance
    health_check: true

  # ABS trade press. Direct RSS is paywalled/blocked, so both go through
  # Google News site queries (same pattern as the WSJ feeds above).
  - name: "Asset Securitization Report"
    url: "https://news.google.com/rss/search?q=when:7d+site:asreport.americanbanker.com&hl=en-US&gl=US&ceid=US:en"
    category: structured_finance
    health_check: true

  - name: "Auto Finance News"
    url: "https://news.google.com/rss/search?q=when:7d+site:autofinancenews.net&hl=en-US&gl=US&ceid=US:en"
    category: structured_finance
    health_check: true

